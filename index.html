  const ind=s.ind||{};let tags=[];
  if(ind.ma20!=null)tags.push(s.price>ind.ma20?'<span class="tag good">站上MA20</span>':'<span class="tag bad">跌破MA20</span>');
  if(ind.macd_sig)tags.push(ind.macd_hist>0?'<span class="tag good">MACD红</span>':'<span class="tag bad">MACD绿</span>');
  if(ind.rsi6!=null)tags.push(ind.rsi6>70?'<span class="tag warn">RSI超买'+ind.rsi6+'</span>':ind.rsi6<30?'<span class="tag warn">RSI超卖'+ind.rsi6+'</span>':'<span class="tag" style="background:#1a2233;color:#8892a6">RSI'+ind.rsi6+'</span>');
  const p=s.pnl_pct;const cls=pctCls(p);
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="head"><div><span class="name">'+s.name+'</span><span class="code">'+s.code+'</span></div><div class="price '+cls+'">'+fmt(s.price)+' <span style="font-size:13px">'+(s.chg_pct==null?'':sign(fmt(s.chg_pct))+'%')+'</span></div></div>'+
  '<div>'+tags.join('')+'</div>'+
  '<div class="meta">成本 <b>'+fmt(s.cost,2)+'</b> · 盈亏 <b class="'+cls+'">'+(p==null?'-':sign(fmt(p,1))+'%')+'</b><br>'+
  'MA5 <b>'+fmt(ind.ma5)+'</b> · MA10 <b>'+fmt(ind.ma10)+'</b> · MA20 <b>'+fmt(ind.ma20)+'</b> · MA60 <b>'+fmt(ind.ma60)+'</b><br>'+
  'PE <b>'+s.pe+'</b> · PB <b>'+s.pb+'</b> · 市值 <b>'+s.mcap+'亿</b> · 换手 <b>'+s.turnover+'%</b> · 量比 <b>'+(s.vol_ratio_live??ind.vol_ratio)+'</b><br>'+
  'MACD <b>DIF '+fmt(ind.macd_dif,2)+'/DEA '+fmt(ind.macd_dea,2)+'/柱 '+fmt(ind.macd_hist,2)+'</b> · KDJ <b>'+fmt(ind.kdj_k,0)+'/'+fmt(ind.kdj_d,0)+'</b><br>'+
  '60日区间 <b>'+fmt(ind.low60)+' ~ '+fmt(ind.high60)+'</b></div><div class="kline" id="kc_'+s.code+'"></div>';
  // 持仓诊断：概念 + 资金流
  const dg = (DATA.diags||{})[s.code]||{};
  if (dg.concepts && dg.concepts.length) {
    const f = dg.fund;
    let fundTxt = '<span style="color:#8892a6">资金流暂无</span>';
    if (f) {
      const mc = f.main_net_wan;
      fundTxt = '<b class="'+(mc>0?'up':'down')+'">主力'+(mc>0?'+':'')+(mc/10000).toFixed(2)+'亿</b> (超大'+(f.super_net_wan/10000).toFixed(2)+'亿/大单'+(f.large_net_wan/10000).toFixed(2)+'亿/散户'+(f.small_net_wan/10000).toFixed(2)+'亿)';
    }
    card.innerHTML += '<div style="background:#122a3a;border:1px solid #2a5a7a;border-radius:6px;padding:6px 8px;margin-top:6px;font-size:11px;color:#7ec8ff;line-height:1.8">🏷️ 板块: '+dg.concepts.slice(0,6).join(' / ')+'<br>💰 '+fundTxt+'</div>';
  }
  grid.appendChild(card);
  drawKline('kc_'+s.code,s.kline||[],charts);
});

function drawKline(id,rows,charts){
  const el=document.getElementById(id);if(!el||!rows||rows.length<30)return;
  const ch=echarts.init(el);charts.push(ch);
  const dates=rows.map(r=>r.time||r.date);
  const kdata=rows.map(r=>[r.open,r.close,r.low,r.high].map(Number));
  const vols=rows.map(r=>Number(r.volume));
  const closes=rows.map(r=>Number(r.close));
  function maArr(p){return closes.map((_,i)=>{if(i<p-1)return null;let s=0;for(let j=i-p+1;j<=i;j++)s+=closes[j];return +(s/p).toFixed(2);});}
  ch.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'#1a2233',borderColor:'#2a3a55',textStyle:{color:'#e8ecf4'}},
  grid:[{left:45,right:12,top:12,height:'62%'},{left:45,right:12,top:'78%',height:'16%'}],
  xAxis:[{type:'category',data:dates,axisLine:{lineStyle:{color:'#33415e'}},axisLabel:{color:'#55607a',fontSize:10},splitLine:{show:false}},{type:'category',gridIndex:1,data:dates,axisLabel:{show:false},axisLine:{lineStyle:{color:'#33415e'}}}],
  yAxis:[{scale:true,splitLine:{lineStyle:{color:'#1c2436'}},axisLabel:{color:'#55607a',fontSize:10}},{gridIndex:1,scale:true,splitLine:{show:false},axisLabel:{show:false}}],
  dataZoom:[{type:'inside',xAxisIndex:[0,1],start:50,end:100}],
  series:[{type:'candlestick',data:kdata,itemStyle:{color:'#ef5350',color0:'#26a69a',borderColor:'#ef5350',borderColor0:'#26a69a'}},
  {name:'MA5',type:'line',data:maArr(5),symbol:'none',lineStyle:{width:1,color:'#ffb454'}},
  {name:'MA20',type:'line',data:maArr(20),symbol:'none',lineStyle:{width:1,color:'#42a5f5'}},
  {name:'MA60',type:'line',data:maArr(60),symbol:'none',lineStyle:{width:1,color:'#ab47bc'}},
  {name:'量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vols.map((v,i)=>({value:v,itemStyle:{color:kdata[i][1]>=kdata[i][0]?'#ef535066':'#26a69a66'}}))}]});
}

// 形态信号
const patternEl=document.getElementById('patternList');
const holdCodes=new Set(DATA.hold_codes||[]);
document.getElementById('patternHint').textContent='扫描候选池 '+(DATA.patterns.length||0)+' 只（涨停池+人气榜+持仓）· 数据时间 '+DATA.ts;
const clsMap={BUY:['#16301f','#7ee2a8','🟢 建议关注（买入信号）'],SELL:['#3a1d1d','#ff8f8f','🔴 建议警惕（卖出信号）'],MIX:['#33291a','#ffb454','🟡 信号冲突（观望）'],HOLD:['#1a2233','#8892a6','⚪ 趋势持有'],WATCH:['#1a2233','#55607a','⚪ 观望']};
const order=['BUY','SELL','MIX','HOLD','WATCH'];
// 持仓股单独优先展示
const holds=DATA.patterns.filter(r=>holdCodes.has(r.code));
const others=DATA.patterns.filter(r=>!holdCodes.has(r.code));
let html='';
function renderGroup(title,list,bg,color){
  if(!list.length)return;
  html+='<div style="margin-bottom:12px"><div style="color:'+color+';font-weight:700;margin-bottom:4px;font-size:13px">'+title+' ('+list.length+')</div><div class="pattern-grid">';
  list.forEach(r=>{
    const sigs=(r.signals||[]).map(s=>'<span style="color:'+(s.direction==='BUY'?'#7ee2a8':s.direction==='SELL'?'#ff8f8f':'#8892a6')+'">'+s.type+'</span>').join(' ');
    const isHold=holdCodes.has(r.code)?'<span class="hold-flag">我的持仓</span>':'';
    html+='<div class="pattern-card" style="background:'+bg+'"><div class="nm">'+r.name+' <span style="color:#55607a;font-size:11px">'+r.code+'</span>'+isHold+'</div><div class="msg">'+r.message+'</div><div class="src">'+r.source+' · 现价'+(r.price??'-')+' · '+sigs+'</div></div>';
  });
  html+='</div></div>';
}
if(holds.length){html+='<div style="background:#122a3a;border:1px solid #2a5a7a;border-radius:10px;padding:10px;margin-bottom:14px"><div style="color:#7ec8ff;font-weight:700;margin-bottom:8px;font-size:14px">⭐ 我的持仓形态信号 ('+holds.length+')</div>';order.forEach(k=>{const[bg,color,label]=clsMap[k];const items=holds.filter(r=>r.conclusion===k);renderGroup(label,items,bg,color);});html+='</div>';}
order.forEach(k=>{const[bg,color,label]=clsMap[k];const items=others.filter(r=>r.conclusion===k);renderGroup(label,items,bg,color);});
patternEl.innerHTML=html||'<span style="color:#8892a6">暂无候选信号</span>';

// 科技板块
const techEl=document.getElementById('techBoard');
if(DATA.tech_boards&&DATA.tech_boards.length){let h='<table><tr><th>板块</th><th>涨跌%</th><th>主力净额(亿)</th><th>领涨股</th></tr>';DATA.tech_boards.forEach(r=>{h+='<tr><td>'+r.name+'</td><td class="'+pctCls(r.change_pct)+'">'+sign(fmt(r.change_pct))+'%</td><td class="'+(r.main_net_yi>0?'up':'down')+'">'+sign(fmt(r.main_net_yi,2))+'</td><td style="color:#8892a6">'+r.leader+'</td></tr>';});h+='</table>';techEl.innerHTML=h;}
else{techEl.innerHTML='<span style="color:#8892a6">今日无强势科技板块（科技普遍回调）</span>';}

// 热点
const hotEl=document.getElementById('hotTable');
if(DATA.hot_err){hotEl.innerHTML='<span style="color:#ff8f8f">热点不可用: '+DATA.hot_err+'</span>';}
else if(DATA.hot&&DATA.hot.length){let h='<table><tr><th>名称</th><th>代码</th><th>题材归因</th><th>市场</th></tr>';DATA.hot.forEach(r=>{h+='<tr><td>'+(r['名称']||'')+'</td><td style="color:#55607a">'+(r['代码']||'')+'</td><td style="color:#8892a6;max-width:300px">'+((r['题材归因']||'').slice(0,40))+'</td><td>'+(r['市场']||'')+'</td></tr>';});h+='</table>';hotEl.innerHTML=h;}
else{hotEl.innerHTML='<span style="color:#8892a6">暂无数据</span>';}
</script>
</body>
</html>
